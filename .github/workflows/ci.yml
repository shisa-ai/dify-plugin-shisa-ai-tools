name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt PyYAML
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          import yaml

          manifest = yaml.safe_load(pathlib.Path("manifest.yaml").read_text(encoding="utf-8"))
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          provider = yaml.safe_load(pathlib.Path("provider/shisa_ai_tools.yaml").read_text(encoding="utf-8"))
          assert manifest["version"] == project["project"]["version"]
          assert manifest["author"] == "shisa-ai"
          assert "tools/translate_text.yaml" in provider["tools"]
          print(f"validated plugin {manifest['name']} {manifest['version']}")
          PY
