name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "2026-07-29T00:00:00Z"
  DIFY_CLI_VERSION: "0.6.6"
  DIFY_CLI_SHA256: "1193fff00a1453b7b3b92ae76ff727760bd1aea9e28834e7a43bac602a0ff011"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.22"
          enable-cache: false
      - name: Verify lockfile
        run: uv lock --check
      - name: Install frozen environment
        run: uv sync --frozen --no-install-project
      - name: Verify hashed Dify requirements export
        run: |
          uv export --frozen --no-dev --no-emit-project --no-header --no-annotate --output-file /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt
          uv run --frozen pip-audit --require-hashes -r requirements.txt
      - name: Compile Python
        run: uv run --frozen python -m compileall -q main.py shisa_client.py provider tools scripts tests
      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Validate workflows
        run: uv run --frozen python scripts/validate_workflows.py
      - name: Generate and validate SBOM
        run: |
          uv run --frozen python scripts/generate_sbom.py --output SBOM.cdx.json
          python -m json.tool SBOM.cdx.json >/dev/null
      - name: Build and validate Dify package
        shell: bash
        run: |
          mkdir -p dist
          curl --fail --silent --show-error --location \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_CLI_VERSION}/dify-plugin-linux-amd64" \
            --output /tmp/dify-plugin
          echo "${DIFY_CLI_SHA256}  /tmp/dify-plugin" | sha256sum --check --strict
          chmod 0755 /tmp/dify-plugin
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          /tmp/dify-plugin plugin package . --output_path "dist/shisa-ai-tools-${VERSION}.difypkg"
          uv run --frozen python scripts/validate_package.py "dist/shisa-ai-tools-${VERSION}.difypkg"
      - name: Validate plugin metadata
        run: |
          uv run --frozen python - <<'PY'
          import pathlib
          import tomllib
          import yaml

          manifest = yaml.safe_load(pathlib.Path("manifest.yaml").read_text(encoding="utf-8"))
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          assert manifest["version"] == project["project"]["version"]
          assert manifest["author"] == "shisa-ai"
          assert manifest["meta"]["version"] == "0.0.1"
          assert manifest["repo"] == "https://github.com/shisa-ai/dify-plugin-shisa-ai-tools"
          provider = yaml.safe_load(pathlib.Path("provider/shisa_ai_tools.yaml").read_text(encoding="utf-8"))
          assert "tools/translate_text.yaml" in provider["tools"]
          print(f"validated plugin {manifest['name']} {manifest['version']}")
          PY

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
