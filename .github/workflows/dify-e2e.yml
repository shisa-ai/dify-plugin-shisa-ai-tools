name: Dify E2E

# Automates the previously-manual step: install the built plugin into a real
# Dify instance, import the verified workflow, run it, and assert the outputs.
# Dify is started and destroyed entirely inside this GitHub runner.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dify-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DIFY_VERSION: "1.16.1"
  DIFY_CLI_VERSION: "0.6.6"
  DIFY_CLI_SHA256: "1193fff00a1453b7b3b92ae76ff727760bd1aea9e28834e7a43bac602a0ff011"
  UV_EXCLUDE_NEWER: "2026-07-29T00:00:00Z"
  DIFY_ADMIN_EMAIL: "admin@shisa.ai"
  DIFY_ADMIN_PASSWORD: "shisa-e2e-local"
  DIFY_COMPOSE_DIR: "/tmp/dify-src/docker"

jobs:
  dify-e2e:
    # Fork PRs run in structural mode (no secrets); same-repo PRs, tags and
    # manual dispatches run the full mode with real API assertions.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: "Guard: only admins may dispatch manually"
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perms="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission 2>/dev/null)" || {
            echo "::error::could not verify dispatcher permission"
            exit 1
          }
          echo "actor=${GITHUB_ACTOR} permission=${perms}"
          if [ "${perms}" != "admin" ]; then
            echo "::error::only repository admins may trigger this workflow"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.22"
          enable-cache: false
      - name: Install frozen environment
        run: uv sync --frozen --no-install-project
      - name: Install Dify packaging CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_CLI_VERSION}/dify-plugin-linux-amd64" \
            --output /tmp/dify-plugin
          echo "${DIFY_CLI_SHA256}  /tmp/dify-plugin" | sha256sum --check --strict
          chmod 0755 /tmp/dify-plugin
          /tmp/dify-plugin version
      - name: Build plugin package
        shell: bash
        run: |
          mkdir -p dist
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          /tmp/dify-plugin plugin package . --output_path "dist/shisa-ai-tools-${VERSION}.difypkg"
          echo "package=dist/shisa-ai-tools-${VERSION}.difypkg" >> "${GITHUB_ENV}"
      - name: Start Dify
        shell: bash
        run: |
          git clone --depth 1 --branch "${DIFY_VERSION}" \
            https://github.com/langgenius/dify.git /tmp/dify-src
          cd "${DIFY_COMPOSE_DIR}"
          python - <<'PY'
          import pathlib
          import secrets

          lines = pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines()
          out = []
          for line in lines:
              if line.startswith("SECRET_KEY="):
                  out.append("SECRET_KEY=" + secrets.token_hex(16))
              elif line.startswith("INIT_PASSWORD="):
                  out.append("INIT_PASSWORD=${DIFY_ADMIN_PASSWORD}")
              elif line.startswith("FORCE_VERIFYING_SIGNATURE="):
                  # Mirrors the production workspace where unsigned packages load.
                  out.append("FORCE_VERIFYING_SIGNATURE=false")
              else:
                  out.append(line)
          # The plugin runtime fetches generated files inside the Docker
          # network, so file URLs must resolve to the nginx service, not localhost.
          out.append("INIT_EMAIL=${DIFY_ADMIN_EMAIL}")
          out.append("INIT_USERNAME=admin")
          out.append("FILES_URL=http://nginx")
          pathlib.Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          docker compose -f docker-compose.yaml up -d
      - name: Wait for Dify API
        shell: bash
        run: |
          for i in $(seq 1 120); do
            if curl --silent --fail "http://localhost/console/api/setup" >/dev/null; then
              echo "Dify is ready"
              exit 0
            fi
            docker compose -f "${DIFY_COMPOSE_DIR}/docker-compose.yaml" ps >/dev/null 2>&1 || true
            sleep 5
          done
          echo "Dify did not become ready" >&2
          docker compose -f "${DIFY_COMPOSE_DIR}/docker-compose.yaml" logs --tail 200 >&2 || true
          exit 1
      - name: Fetch verified fixtures
        run: |
          git clone --depth 1 https://github.com/shisa-ai/shisa-dify-workflows.git /tmp/fixtures
      - name: Run Dify E2E harness
        env:
          DIFY_BASE_URL: "http://localhost"
          DIFY_INIT_PASSWORD: "${{ env.DIFY_ADMIN_PASSWORD }}"
          SHISA_API_KEY: "${{ secrets.SHISA_API_KEY }}"
          STRUCTURAL: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}"
          PKG_PATH: "${{ env.package }}"
          DSL_PATH: "/tmp/fixtures/fixtures/shisa-tools-smoke.yml"
        shell: bash
        run: uv run --frozen python scripts/dify_e2e.py
      - name: Teardown Dify
        if: always()
        shell: bash
        run: docker compose -f "${DIFY_COMPOSE_DIR}/docker-compose.yaml" down -v
