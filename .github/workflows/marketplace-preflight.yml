# Marketplace pre-flight: runs the official langgenius marketplace package
# checks (contents / secrets / binaries / manifest / readme / dependencies)
# against our build, on Linux. Real install + run is already covered by the
# dify-e2e workflow, so it is not duplicated here. Submission-time checks
# (PR body, version-not-exists, packaging upload) run on the real
# langgenius/dify-plugins pre-check when we submit.

name: Marketplace Pre-flight

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: marketplace-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "2026-07-29T00:00:00Z"
  DIFY_CLI_VERSION: "0.6.6"
  DIFY_CLI_SHA256: "1193fff00a1453b7b3b92ae76ff727760bd1aea9e28834e7a43bac602a0ff011"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.22"
          enable-cache: false

      - name: Clone official Marketplace Toolkit
        run: git clone --depth 1 https://github.com/langgenius/dify-marketplace-toolkit.git .scripts

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq unzip jq
          pip install requests

      - name: Install yq binary
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/mikefarah/yq/releases/download/v4.44.5/yq_linux_amd64" \
            --output /usr/local/bin/yq
          chmod 0755 /usr/local/bin/yq
          yq --version

      - name: Build plugin package
        run: |
          mkdir -p dist
          curl --fail --silent --show-error --location \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_CLI_VERSION}/dify-plugin-linux-amd64" \
            --output /tmp/dify-plugin
          echo "${DIFY_CLI_SHA256}  /tmp/dify-plugin" | sha256sum --check --strict
          chmod 0755 /tmp/dify-plugin
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          /tmp/dify-plugin plugin package . --output_path "dist/plugin-${VERSION}.difypkg"
          echo "PACKAGE=dist/plugin-${VERSION}.difypkg" >> "${GITHUB_ENV}"

      - name: Unpack package
        run: |
          mkdir -p unpacked_plugin
          unzip "${PACKAGE}" -d unpacked_plugin
          echo "PLUGIN_PATH=unpacked_plugin" >> "${GITHUB_ENV}"

      - name: Run official marketplace checks
        run: |
          set -e
          for check in \
            check-package-contents \
            check-package-secrets \
            check-package-binaries \
            check-manifest-metadata \
            check-readme-metadata \
            check-package-dependencies; do
            echo "== ${check} =="
            python ".scripts/validator/${check}.py" -d "${PLUGIN_PATH}" || exit 1
          done
