# Marketplace pre-flight: runs the same checks langgenius/dify-plugins applies
# to a submission, against our own build, on Linux with the official toolkit
# and the official plugin daemon. This is the real gate before we submit to
# the Dify Marketplace — not a local preview.

name: Marketplace Pre-flight

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: marketplace-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "2026-07-29T00:00:00Z"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.22"
          enable-cache: false

      - name: Clone Marketplace Toolkit (official scripts)
        run: |
          git clone --depth 1 https://github.com/langgenius/dify-marketplace-toolkit.git .scripts

      - name: Download official Plugin Daemon
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64" \
            --output .scripts/dify-plugin-linux-amd64
          chmod +x .scripts/dify-plugin-linux-amd64

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq \
            ffmpeg build-essential git cmake pkg-config \
            libcairo2-dev libjpeg-dev libgif-dev jq

      - name: Setup yq
        uses: mikefarah/yq@bc5b54cb1d1f720db16c9f75c5b45384d00e5cbf # v4.44.5
        with:
          cmd: yq --version

      - name: Install Python dependencies for the checks
        run: pip install requests packaging

      - name: Build plugin package
        run: |
          mkdir -p dist
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          .scripts/dify-plugin-linux-amd64 plugin package . --output_path "dist/plugin-${VERSION}.difypkg"
          echo "package=dist/plugin-${VERSION}.difypkg" >> "${GITHUB_ENV}"

      - name: Unpack package
        run: |
          mkdir -p unpacked_plugin
          unzip "${package}" -d unpacked_plugin
          echo "PLUGIN_PATH=unpacked_plugin" >> "${GITHUB_ENV}"

      - name: Run official package checks
        run: |
          set -e
          for check in \
            check-package-contents \
            check-package-secrets \
            check-package-binaries \
            check-manifest-metadata \
            check-readme-metadata \
            check-package-dependencies; do
            echo "== ${check} =="
            python ".scripts/validator/${check}.py" -d "${PLUGIN_PATH}" || exit 1
          done

      - name: Check Plugin Install (official test-plugin-install.py)
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r "${PLUGIN_PATH}/requirements.txt"
          export INSTALL_METHOD=serverless
          export SERVERLESS_PORT=8080
          export SERVERLESS_HOST=0.0.0.0
          timeout 300 python .scripts/validator/test-plugin-install.py -d "${PLUGIN_PATH}" || exit 1

      - name: Check Packaging (official uploader --test)
        run: |
          python .scripts/uploader \
            -d "${PLUGIN_PATH}" \
            -t placeholder \
            --plugin-daemon-path .scripts/dify-plugin-linux-amd64 \
            -u https://marketplace.dify.ai \
            -f \
            --test
