identity:
  author: shisa-ai
  name: shisa_ai_tools
  label:
    en_US: Shisa AI Tools
    ja_JP: Shisa AI ツール
  description:
    en_US: Generate speech in Shisa AI's native formats and discover voices dynamically.
    ja_JP: Shisa AIのネイティブ形式で音声を生成し、音声一覧を動的に取得します。
  icon: shisa-icon.png
  tags:
    - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
      ja_JP: APIキー
    placeholder:
      en_US: Enter your Shisa AI API key
      ja_JP: Shisa AI APIキーを入力してください
    help:
      en_US: Get your API key from the Shisa AI dashboard.
      ja_JP: Shisa AIダッシュボードからAPIキーを取得してください。
    url: https://platform.shisa.ai/dashboard
  api_base:
    type: text-input
    required: true
    default: https://api.shisa.ai
    label:
      en_US: API Base URL
      ja_JP: APIベースURL
    placeholder:
      en_US: https://api.shisa.ai
      ja_JP: https://api.shisa.ai
tools:
  - tools/list_voices.yaml
  - tools/generate_speech.yaml
extra:
  python:
    source: provider/shisa_ai_tools.py
